version: "3.8"

services:
  app:
    container_name: wellness-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9999:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/wellness_db?schema=public
      - REDIS_URL=redis://redis:6379
      - AI_BASE_URL=http://host.docker.internal:11434
      - AI_MODEL=qwen2.5:7b
      - AI_API_KEY=ollama
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=http://wellness.local:9999
      - JWT_SECRET=your-super-secret-jwt-key-change-this
      - PASSWORD_SALT=your-password-salt-change-this
      - ROOT_DOMAIN=wellness.local
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  db:
    container_name: wellness-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wellness_db
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    container_name: wellness-redis
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  pgadmin:
    container_name: wellness-admin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
