version: "3.8"

services:
  db:
    container_name: wellness-db
    image: postgres:16
    restart: always
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wellness_db
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_parallel_workers_per_gather=2"
    mem_limit: 2g
    cpus: 2.0

  mongodb:
    container_name: wellness-mongo
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1.0

  mongo-express:
    container_name: wellness-mongo-express
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongoadmin
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongopassword
      ME_CONFIG_MONGODB_URL: mongodb://mongoadmin:mongopassword@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    mem_limit: 512m
    cpus: 0.5

  pgadmin:
    container_name: wellness-admin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword

      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: "10"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"

      # ✅ แก้ CSRF สำหรับ multi-user access
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
      PGADMIN_CONFIG_SESSION_COOKIE_SAMESITE: "'Lax'"
      PGADMIN_CONFIG_SESSION_COOKIE_HTTPONLY: "True"

    ports:
      - "8080:80"
    depends_on:
      - db
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping').read()" ]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── LiteLLM Proxy — AI Model Gateway with Logging ──
  litellm:
    container_name: wellness-litellm
    image: ghcr.io/berriai/litellm:main-stable
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    environment:
      LITELLM_MASTER_KEY: "sk-litellm-wellness-2026"
      LITELLM_LOG_LEVEL: "DEBUG"
      # Ollama host (accessible from Docker)
      OLLAMA_API_BASE: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    mem_limit: 512m
    cpus: 0.5

volumes:
  db_data:
  mongo_data:
