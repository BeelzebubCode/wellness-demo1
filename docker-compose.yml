version: "3.8"

services:
  db:
    container_name: wellness-db
    image: postgres:16
    restart: always
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wellness_db
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_parallel_workers_per_gather=2"
    mem_limit: 2g
    cpus: 2.0

  mongodb:
    container_name: wellness-mongo
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1.0

  mongo-express:
    container_name: wellness-mongo-express
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongoadmin
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongopassword
      ME_CONFIG_MONGODB_URL: mongodb://mongoadmin:mongopassword@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    mem_limit: 512m
    cpus: 0.5

  pgadmin:
    container_name: wellness-admin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      # กัน pgadmin เก็บ session / cache บวม และลดภาระ
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: 10
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 30
    ports:
      - "8080:80"
    depends_on:
      - db
    # ✅ ตัวสำคัญ: ล็อก RAM pgAdmin (แนะนำ 512MB–1GB)
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    # เพิ่ม healthcheck กันค้าง
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  mongo_data: